<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Goal</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  .goal {
    width: 440px;
    padding: 18px 20px 20px;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    position: relative;
    overflow: hidden;
    animation: enter .7s var(--ease-out) both;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(14px); } }

  .goal::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(115deg, var(--accent), var(--accent-2) 50%, transparent 80%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
    pointer-events: none;
  }

  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 13px;
  }
  .label {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -.01em;
  }
  .count { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; color: var(--muted); }
  .count b { color: var(--ink); font-size: 20px; font-weight: 800; font-family: var(--font-display); }

  /* --- the bar ---------------------------------------------------------- */

  .track {
    position: relative;
    height: 18px;
    border-radius: 999px;
    background: rgba(255,255,255,.07);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
    overflow: hidden;
  }

  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 22px var(--accent-glow);
    transition: width 1.1s var(--ease-out);
  }

  /* moving stripes so the bar reads as "live" even when idle */
  .fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: linear-gradient(115deg,
      rgba(255,255,255,.20) 25%, transparent 25%, transparent 50%,
      rgba(255,255,255,.20) 50%, rgba(255,255,255,.20) 75%, transparent 75%);
    background-size: 28px 28px;
    animation: stripes 1.1s linear infinite;
  }
  @keyframes stripes { to { background-position: 28px 0; } }

  /* bright leading edge */
  .head-glow {
    position: absolute;
    top: -3px; bottom: -3px;
    width: 12px;
    margin-left: -6px;
    border-radius: 999px;
    background: #fff;
    filter: blur(5px);
    opacity: .85;
    transition: left 1.1s var(--ease-out);
  }

  .pct {
    position: absolute;
    /* sits in the gap the barbox reserves above the track, not in the
       header row — otherwise a high percentage collides with the count */
    top: 0;
    transform: translateX(-50%);
    padding: 3px 9px;
    border-radius: 8px;
    background: var(--accent);
    color: #0b0a12;
    font-size: 12px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 6px 18px var(--accent-glow);
    transition: left 1.1s var(--ease-out);
    white-space: nowrap;
  }
  .pct::after {
    content: '';
    position: absolute;
    left: 50%; bottom: -4px;
    width: 8px; height: 8px;
    margin-left: -4px;
    background: var(--accent);
    transform: rotate(45deg);
    border-radius: 1px;
  }

  .barbox { position: relative; padding-top: 34px; }

  /* --- reactions -------------------------------------------------------- */

  .goal.bump { animation: bump .55s var(--ease-back); }
  @keyframes bump {
    30% { transform: scale(1.025); }
    to  { transform: scale(1); }
  }

  .float {
    position: absolute;
    right: 20px;
    top: 46px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 20px;
    color: var(--accent-3);
    pointer-events: none;
    animation: floatUp 1.3s var(--ease-out) forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(6px) scale(.8); }
    25%  { opacity: 1; transform: translateY(-4px) scale(1); }
    100% { opacity: 0; transform: translateY(-38px) scale(1); }
  }

  .goal.done .fill { background: linear-gradient(90deg, var(--accent-3), #fff 65%, var(--accent-3)); }
  .goal.done .label::after { content: ' ✓'; color: var(--accent-3); }

  @media (prefers-reduced-motion: reduce) {
    .fill::after { animation: none; }
  }
</style>
<script>
/* Skin loader — see alerts.html. */
(function () { var d = 'default'; var m = /[?&]skin=([\w-]+)/.exec(location.search);
  document.write('<link rel="stylesheet" href="../skins/' + (m ? m[1] : d) + '/skin.css">'); })();
</script>
</head>
<body class="page-goal">

<div class="anchor" id="stage">
  <div class="goal" id="goal">
    <div class="head">
      <div class="label" id="label"></div>
      <div class="count"><b id="current">0</b> <span id="sep">/</span> <span id="target">0</span></div>
    </div>
    <div class="barbox">
      <div class="pct" id="pct">0%</div>
      <div class="track">
        <div class="fill" id="fill"></div>
      </div>
      <div class="head-glow" id="glow"></div>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/connect.js"></script>
<script>
function startOverlay() {
  'use strict';

  var settings = Overlay.init({ pos: 'bottom-left' });
  Overlay.place(document.getElementById('stage'), settings.pos);

  var cfg = OverlayConfig.goal;
  var current = Params.num('current', cfg.current);
  var target = Math.max(1, Params.num('target', cfg.target));
  var counts = Params.list('count', cfg.countEvents);

  var box = document.getElementById('goal');
  var fill = document.getElementById('fill');
  var glow = document.getElementById('glow');
  var pct = document.getElementById('pct');
  var currentEl = document.getElementById('current');

  document.getElementById('label').textContent = Params.get('label', cfg.label);
  document.getElementById('target').textContent = Fmt.number(target);

  /* Count up to the new number rather than snapping to it. */
  var displayed = current;
  var tween = null;

  function paint(animate) {
    var ratio = Math.min(1, current / target);
    var percent = Math.round(ratio * 100);

    fill.style.width = (ratio * 100) + '%';
    glow.style.left = (ratio * 100) + '%';
    glow.style.opacity = ratio > 0.01 && ratio < 0.995 ? '.85' : '0';
    pct.style.left = Math.min(96, Math.max(4, ratio * 100)) + '%';
    pct.textContent = percent + '%';
    box.classList.toggle('done', current >= target);

    if (!animate) {
      displayed = current;
      currentEl.textContent = Fmt.number(displayed);
      return;
    }

    /* Roll the number over ~700ms so the eye can follow it. */
    var from = displayed;
    var to = current;
    var start = performance.now();
    if (tween) cancelAnimationFrame(tween);
    (function step(now) {
      var t = Math.min(1, (now - start) / 700);
      var eased = 1 - Math.pow(1 - t, 3);
      displayed = from + (to - from) * eased;
      currentEl.textContent = Fmt.number(displayed);
      if (t < 1) tween = requestAnimationFrame(step);
    })(start);
  }

  function add(n) {
    if (!n) return;
    current = Math.max(0, current + n);
    paint(true);

    box.classList.remove('bump');
    void box.offsetWidth;
    box.classList.add('bump');

    var float = document.createElement('div');
    float.className = 'float';
    float.textContent = (n > 0 ? '+' : '−') + Fmt.number(Math.abs(n));
    box.appendChild(float);
    setTimeout(function () { float.remove(); }, 1400);
  }

  paint(false);

  /* Any event type listed in `count` moves the bar. Gift bombs move it
     by the number of subs, not by one. */
  counts.forEach(function (type) {
    Bus.on(type, function (ev) {
      add(type === 'subbomb' ? (ev.amount || 1) : 1);
    });
  });

  /* The control room can set or nudge the bar directly. */
  Bus.on('goal:set', function (d) {
    if (typeof d.target === 'number') {
      target = Math.max(1, d.target);
      document.getElementById('target').textContent = Fmt.number(target);
    }
    if (typeof d.current === 'number') { current = d.current; paint(true); }
    if (typeof d.add === 'number') add(d.add);
    if (d.label) document.getElementById('label').textContent = d.label;
  });

  Connect.start({ demo: { chat: false, alertEvery: 4500 } });
}

/* See alerts.html. */
if (!window.SE_DEFER) startOverlay();
</script>
</body>
</html>
